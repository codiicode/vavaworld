[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
# fat LTO miscompiles h3o under platform-tools v1.54 (h3 index ends up as a
# write address -> "Access violation in unallocated region" in claim).
# Thin/no LTO generates correct code; binary is slightly larger.
lto = false
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
